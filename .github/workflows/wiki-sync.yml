name: Wiki Sync

# The user documentation wiki is authored in docs/wiki/ and reviewed through
# normal pull requests. Layout is flat because GitHub Wiki page names are
# globally unique across directories: English pages keep their bare names
# (Installation.md, authoritative) and Chinese mirrors use the .zh-CN suffix
# (Installation.zh-CN.md). The GitHub Wiki tab is a read-only mirror: this
# workflow force-syncs it on every change, deleting pages that no longer
# exist in docs/wiki/ so direct wiki edits do not survive.

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/wiki-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync docs/wiki to the GitHub Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WIKI_DIR=$(mktemp -d)
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$WIKI_DIR"
          rsync -av --delete --exclude=".git" docs/wiki/ "$WIKI_DIR/"
          # GitHub Wiki renders `](Page.md)` links as raw-file downloads and
          # extensionless `](Page)` links as page navigation. Strip the .md
          # suffix from wiki-internal links in the synced copy only — the
          # repo source keeps .md so links work when browsing docs/wiki/ on
          # GitHub. Absolute (https://) links are untouched.
          find "$WIKI_DIR" -name "*.md" -exec perl -pi -e \
            's|\]\(([A-Za-z0-9.%-]+)\.md(#[^)]*)?\)|]($1$2)|g' {} +
          git -C "$WIKI_DIR" config user.name "github-actions[bot]"
          git -C "$WIKI_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$WIKI_DIR" add -A
          if git -C "$WIKI_DIR" diff --cached --quiet; then
            echo "wiki already in sync"
            exit 0
          fi
          git -C "$WIKI_DIR" commit -m "Sync wiki from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git -C "$WIKI_DIR" push
