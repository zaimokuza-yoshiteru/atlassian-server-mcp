name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Full gate incl. eslint, coverage thresholds, and the npm package smoke.
      - name: Full CI suite
        if: runner.os == 'Linux'
        run: pnpm test:ci
      # Windows runs the cross-platform subset: lint, typecheck, unit (unix-only
      # cases are skipIf'd, so coverage thresholds would not hold), contract,
      # and the package smoke (cross-platform since the temp dir and dist
      # source-mapping checks were made OS-neutral). The coverage gate stays
      # Linux-only.
      - name: Lint, typecheck, unit, and contract tests
        if: runner.os == 'Windows'
        run: |
          node node_modules/eslint/bin/eslint.js .
          node node_modules/typescript/bin/tsc --noEmit
          node scripts/clean.mjs
          node node_modules/typescript/bin/tsc -p tsconfig.build.json
          node node_modules/vitest/vitest.mjs run
          node node_modules/vitest/vitest.mjs run --config vitest.contract.config.ts
          node scripts/package-smoke.mjs

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: git diff --check

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build -t atlassian-server-mcp:ci .
      - name: Smoke test the container entrypoint
        run: docker run --rm atlassian-server-mcp:ci --help

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Production dependencies only; fails on high/critical advisories.
      - run: pnpm audit --prod --audit-level=high
